<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
            /* Cambia el color de fondo si lo deseas */
        }
    </style>
</head>

<body>
    <!-- Aquí inserta tu animación SVG -->
    <div>
        <svg width="400" height="200" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <style>
                    .bread {
                        fill: #d6b24a;
                        /* Color del pan */
                        stroke: #8b5a2b;
                        /* Color de la corteza */
                        stroke-width: 2;
                    }

                    .semilla {
                        fill: white;
                        stroke: #8b5a2b;
                        stroke-width: 0.5;
                    }

                    .steam {
                        fill: none;
                        stroke: #ffffff;
                        stroke-width: 1;
                        opacity: 0.8;
                    }

                    .steam-outline {
                        fill: none;
                        stroke: #000000;
                        stroke-width: 0.5;
                    }
                </style>
            </defs>
            <g>
                <!-- Capas del pan -->
                <ellipse class="bread" cx="100" cy="70" rx="60" ry="30" />
                <ellipse class="bread" cx="100" cy="60" rx="60" ry="25" />
                <ellipse class="bread" cx="100" cy="50" rx="60" ry="20" />

                <!-- Semillas en el pan -->
                <ellipse class="semilla" cx="100" cy="60" rx="5" ry="2" />
                <ellipse class="semilla" cx="100" cy="40" rx="5" ry="2" />
                <ellipse class="semilla" cx="70" cy="50" rx="5" ry="2" />
                <ellipse class="semilla" cx="130" cy="50" rx="5" ry="2" />
                <!-- Semillas adicionales -->
                <ellipse class="semilla" cx="80" cy="55" rx="3" ry="1.5" />
                <ellipse class="semilla" cx="120" cy="55" rx="3" ry="1.5" />
                <ellipse class="semilla" cx="90" cy="45" rx="3" ry="1.5" />
                <ellipse class="semilla" cx="110" cy="45" rx="3" ry="1.5" />
                <ellipse class="semilla" cx="85" cy="35" rx="3" ry="1.5" />
                <ellipse class="semilla" cx="115" cy="35" rx="3" ry="1.5" />

                <!-- Animación de movimiento del pan -->
                <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -5" dur="0.5s"
                    repeatCount="indefinite" values="0 0; 0 -5; 0 0" />
            </g>

            <!-- Vapor con borde negro -->
            <g>
                <!-- Línea de vapor con borde -->
                <path class="steam-outline" d="M85 30 C85 25, 90 20, 85 15">
                    <animate attributeName="opacity" values="0.8; 0" dur="1s" repeatCount="indefinite" />
                    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -10" dur="1s"
                        repeatCount="indefinite" />
                </path>
                <path class="steam" d="M85 30 C85 25, 90 20, 85 15">
                    <animate attributeName="opacity" values="0.8; 0" dur="1s" repeatCount="indefinite" />
                    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -10" dur="1s"
                        repeatCount="indefinite" />
                </path>

                <!-- Segunda línea de vapor con borde -->
                <path class="steam-outline" d="M115 30 C115 25, 120 20, 115 15">
                    <animate attributeName="opacity" values="0.8; 0" dur="1s" begin="0.2s" repeatCount="indefinite" />
                    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -10" dur="1s"
                        begin="0.2s" repeatCount="indefinite" />
                </path>
                <path class="steam" d="M115 30 C115 25, 120 20, 115 15">
                    <animate attributeName="opacity" values="0.8; 0" dur="1s" begin="0.2s" repeatCount="indefinite" />
                    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 -10" dur="1s"
                        begin="0.2s" repeatCount="indefinite" />
                </path>
            </g>
        </svg>
    </div>
</body>

</html>
